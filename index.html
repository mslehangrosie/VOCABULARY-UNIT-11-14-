<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Từ Vựng Tiếng Anh - Ms Lê Hằng English</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #4ea8de;
            --primary-dark: #3a86ff;
            --card-bg: #ffffff;
            --text-main: #2b2d42;
            --text-muted: #6c757d;
            --accent-purple: #6a4c93;
            --accent-coral: #ff5964;
            --accent-yellow: #fff3bf;
            --accent-yellow-border: #fcc419;
            --pill-tab-active: #1d3557;
            --pill-tab-inactive: #a8dadc;
            --type-n: #ff922b;
            --type-v: #51cf66;
            --type-adj: #339af0;
            --type-adv: #cc5de8;
            --type-phrase: #ff6b6b;
            --shadow-3d: 0 8px 0 rgba(0, 0, 0, 0.15);
            --shadow-3d-active: 0 4px 0 rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', 'Fredoka', sans-serif;
            background-color: #3a86ff;
            /* Plus / Thập grid pattern background */
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.25) 2px, transparent 2.5px),
                linear-gradient(to right, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 30px 30px, 30px 30px, 30px 30px;
            background-position: 0 0, 15px 15px, 15px 15px;
            color: var(--text-main);
            padding: 20px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 1. Header */
        .header-box {
            background: #ffffff;
            border: 4px solid var(--accent-purple);
            border-radius: 24px;
            padding: 18px 25px;
            text-align: center;
            box-shadow: 0 8px 0 var(--accent-purple);
            margin-bottom: 25px;
            transform: translateY(0);
            transition: transform 0.2s;
        }

        .header-box h1 {
            color: var(--accent-purple);
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 2. Warning Box */
        .warning-box {
            background-color: #fff9db;
            border: 3.5px solid var(--accent-yellow-border);
            border-radius: 20px;
            padding: 16px 20px;
            text-align: center;
            box-shadow: 0 6px 0 var(--accent-yellow-border);
            margin-bottom: 25px;
        }

        .warning-title {
            color: #e03131;
            font-family: 'Fredoka', sans-serif;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .warning-content {
            color: #5c3c00;
            font-weight: 700;
            font-size: 15px;
            line-height: 1.5;
        }

        .warning-sub {
            font-style: italic;
            color: #d9480f;
            margin-top: 6px;
            font-weight: 800;
        }

        /* 3. Unit Selector */
        .unit-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .unit-btn {
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 18px;
            border-radius: 18px;
            border: 3px solid #00000015;
            cursor: pointer;
            transition: all 0.15s ease;
            background-color: var(--accent-yellow);
            color: #5c3c00;
            box-shadow: 0 5px 0 #e6b800;
            text-transform: uppercase;
        }

        .unit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #e6b800;
        }

        .unit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #e6b800;
        }

        .unit-btn.active {
            background-color: var(--accent-coral);
            color: #ffffff;
            box-shadow: 0 5px 0 #c92a2a;
            border-color: rgba(0, 0, 0, 0.1);
        }

        .unit-btn.active:hover {
            box-shadow: 0 7px 0 #c92a2a;
        }

        /* 4. Tab Navigation */
        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
        }

        .tab-btn.tab-1 {
            background-color: var(--pill-tab-active);
            color: #ffffff;
            box-shadow: 0 5px 0 #0f1d2f;
        }

        .tab-btn.tab-1.active {
            outline: 3px solid #ffffff;
        }

        .tab-btn.tab-2 {
            background-color: var(--pill-tab-inactive);
            color: #1d3557;
            box-shadow: 0 5px 0 #457b9d;
        }

        .tab-btn.tab-2.active {
            background-color: #1d3557;
            color: #ffffff;
            box-shadow: 0 5px 0 #0f1d2f;
            outline: 3px solid #ffffff;
        }

        .tab-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }

        /* Search Bar & Stats */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-input {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #ced4da;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            outline: none;
            width: 250px;
        }

        .search-input:focus {
            border-color: var(--accent-purple);
        }

        .vocab-count {
            font-weight: 700;
            color: var(--accent-purple);
            font-size: 15px;
        }

        /* 5. Vocabulary Cards Grid */
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .vocab-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .vocab-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .vocab-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Vocabulary Card Styling */
        .vocab-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12), 0 10px 20px rgba(0,0,0,0.05);
            border: 3px solid #e9ecef;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            min-height: 220px;
        }

        .vocab-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.12), 0 15px 25px rgba(0,0,0,0.08);
        }

        /* Type Badge */
        .type-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--type-n);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.15);
            text-transform: lowercase;
        }

        .type-badge.v { background-color: var(--type-v); }
        .type-badge.adj { background-color: var(--type-adj); }
        .type-badge.adv { background-color: var(--type-adv); }
        .type-badge.phrase { background-color: var(--type-phrase); font-size: 10px; width: auto; padding: 0 8px; border-radius: 12px; }

        .card-content {
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .word-title {
            font-family: 'Fredoka', sans-serif;
            color: var(--accent-purple);
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .phonetic {
            color: #868e96;
            font-style: italic;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .meaning {
            color: #212529;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .example-box {
            background-color: #f8f9fa;
            border-left: 3.5px solid var(--accent-purple);
            padding: 8px 10px;
            border-radius: 0 10px 10px 0;
            font-size: 13px;
            color: #495057;
            font-style: italic;
            line-height: 1.4;
            margin-top: 6px;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1.5px dashed #e9ecef;
        }

        .audio-btn {
            background-color: #e7f5ff;
            color: #1c7ed6;
            border: 2px solid #74c0fc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #a5d8ff;
            transition: all 0.1s ease;
        }

        .audio-btn:hover {
            background-color: #d0ebff;
            transform: scale(1.05);
        }

        .audio-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #a5d8ff;
        }

        .audio-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Quiz Tab Container */
        .quiz-container {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.15);
            border: 4px solid var(--accent-purple);
            max-width: 800px;
            margin: 0 auto;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .quiz-header h2 {
            color: var(--accent-purple);
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .quiz-progress {
            background-color: #e9ecef;
            border-radius: 12px;
            height: 14px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .quiz-progress-bar {
            background-color: var(--accent-coral);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            background-color: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #e9ecef;
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 18px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: white;
            border: 2.5px solid #ced4da;
            border-radius: 14px;
            padding: 14px 18px;
            text-align: left;
            font-family: 'Nunito', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 0 #ced4da;
        }

        .option-btn:hover {
            border-color: var(--primary-dark);
            background-color: #f0f7ff;
        }

        .option-btn.correct {
            background-color: #d3f9d8 !important;
            border-color: #40c057 !important;
            color: #2b8a3e !important;
            box-shadow: 0 4px 0 #40c057 !important;
        }

        .option-btn.wrong {
            background-color: #ffe3e3 !important;
            border-color: #fa5252 !important;
            color: #c92a2a !important;
            box-shadow: 0 4px 0 #fa5252 !important;
        }

        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .next-btn {
            background-color: var(--accent-coral);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            padding: 12px 24px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 0 #c92a2a;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #c92a2a;
        }

        .score-board {
            text-align: center;
            padding: 30px;
        }

        .score-board h3 {
            font-size: 28px;
            color: var(--accent-purple);
            margin-bottom: 15px;
            font-family: 'Fredoka', sans-serif;
        }

        .restart-btn {
            background-color: var(--primary-dark);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            padding: 14px 28px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 0 #1d3557;
            margin-top: 15px;
        }

        .empty-msg {
            grid-column: 1 / -1;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-purple);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. Header trên cùng -->
    <div class="header-box">
        <h1>GIÁO VIÊN TẠO: MS LÊ HẰNG ENGLISH</h1>
    </div>

    <!-- 2. Hộp thông báo Warning Box -->
    <div class="warning-box">
        <div class="warning-title">
            ⚠️ LỜI NHẮC CỰC KỲ QUAN TRỌNG ⚠️
        </div>
        <div class="warning-content">
            Hãy ôn tập từ vựng thật kỹ trước khi làm bài kiểm tra trắc nghiệm! Nhấp vào biểu tượng loa 🔊 để nghe phát âm chuẩn Anh - Mỹ.
            <div class="warning-sub">* Kéo tới đâu, làm tới đó! *</div>
        </div>
    </div>

    <!-- 3. Thanh chuyển Unit (Unit Selector) -->
    <div class="unit-selector" id="unitSelector">
        <button class="unit-btn" onclick="selectUnit(7)">Unit 7: ON THE MOVE</button>
        <button class="unit-btn" onclick="selectUnit(8)">Unit 8: THROUGH THE AGES</button>
        <button class="unit-btn" onclick="selectUnit(9)">Unit 9: THE NATURAL WORLD</button>
        <button class="unit-btn" onclick="selectUnit(10)">Unit 10: REACHING FOR THE SKIES</button>
        <button class="unit-btn active" onclick="selectUnit(11)">Unit 11: DESIGN AND INNOVATION</button>
        <button class="unit-btn" onclick="selectUnit(12)">Unit 12: INFORMATION TECHNOLOGY</button>
        <button class="unit-btn" onclick="selectUnit(13)">Unit 13: THE MODERN WORLD</button>
        <button class="unit-btn" onclick="selectUnit(14)">Unit 14: URBANISATION</button>
    </div>

    <!-- 4. Thanh chuyển Tab (Tab Navigation) -->
    <div class="tab-nav">
        <button class="tab-btn tab-1 active" id="tab1Btn" onclick="switchTab(1)">Tab 1: Giao Diện Từ Mới</button>
        <button class="tab-btn tab-2" id="tab2Btn" onclick="switchTab(2)">Tab 2: Đề Thi Trắc Nghiệm (30 Câu)</button>
    </div>

    <!-- TAB 1 CONTENT: Vocabulary View -->
    <div id="vocabTab">
        <div class="controls-bar">
            <span class="vocab-count" id="vocabCount">Đang tải từ vựng...</span>
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Tìm kiếm từ vựng..." oninput="filterVocab()">
        </div>
        <div class="vocab-grid" id="vocabGrid">
            <!-- Vocabulary cards will be rendered dynamically -->
        </div>
    </div>

    <!-- TAB 2 CONTENT: Quiz View -->
    <div id="quizTab" class="quiz-container">
        <div class="quiz-header">
            <h2 id="quizUnitTitle">Đề Thi Trắc Nghiệm Unit 11</h2>
            <div class="quiz-progress">
                <div class="quiz-progress-bar" id="quizProgressBar"></div>
            </div>
            <div style="font-weight: 700; color: #6c757d;" id="quizQuestionCount">Câu 1 / 30</div>
        </div>

        <div id="quizContent">
            <!-- Question content will be rendered here -->
        </div>
    </div>
</div>

<script>
// VOCABULARY DATABASE (UNITS 7 TO 14 COMPLETE)
const vocabularyData = {
    7: {
        title: "Unit 7: ON THE MOVE",
        words: [
            { word: "accommodation", type: "n", phonetic: "/əˌkɒm.əˈdeɪ.ʃən/", meaning: "Chỗ ở, tiện nghi ăn ở", example: "We found comfortable accommodation near the train station." },
            { word: "commute", type: "v", phonetic: "/kəˈmjuːt/", meaning: "Đi lại thường xuyên giữa nhà và nơi làm việc", example: "She commutes to London by train every day." },
            { word: "destination", type: "n", phonetic: "/ˌdestɪˈneɪʃən/", meaning: "Điểm đến, đích đến", example: "Paris is a popular tourist destination." },

            { word: "traffic congestion", type: "n", phonetic: "/ˈtræfɪk kənˈdʒestʃən/", meaning: "Ún tắc giao thông", example: "Traffic congestion is a big problem in big cities." }

    },
    8: {

            { word: "archaeology", type: "n", phonetic: "/ˌɑːkiˈɒlədʒi/", meaning: "Khảo cổ học", example: "He studied archaeology at university." },

    9: {

            { word: "biodiversity", type: "n", phonetic: "/ˌbaɪəʊdaɪˈvɜːsəti/", meaning: "Đa dạng sinh học", example: "Rainforests have high biodiversity." },
            { word: "conservation", type: "n", phonetic: "/ˌkɒnsəˈveɪʃən/", meaning: "Sự bảo tồn", example: "Wildlife conservation is essential." },
            { word: "ecosystem", type: "n", phonetic: "/ˈiːkəʊˌsɪstəm/", meaning: "Hệ sinh thái", example: "Pollution threatens the marine ecosystem." },

            { word: "atmosphere", type: "n", phonetic: "/ˈætməsfɪər/", meaning: "Khí quyển", example: "The Earth's atmosphere protects us." },

            { word: "spacecraft", type: "n", phonetic: "/ˈspeɪskrɑːft/", meaning: "Tàu vũ trụ", example: "The spacecraft landed safely." }
        ]
    },
    11: {
        title: "Unit 11: DESIGN AND INNOVATION",
        words: [
            // Nouns
            { word: "balcony", type: "n", phonetic: "/ˈbælkəni/", meaning: "Ban công", example: "She stepped out onto the balcony to enjoy the fresh air." },

// Speech Synthesis Setup
function speakWord(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop current speech if playing
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    } else {
        alert("Trình duyệt của bạn không hỗ trợ phát âm tự động Web Speech API.");
    }
}

// Select Unit Handler
function selectUnit(unitNum) {
    currentUnit = unitNum;
    
    // Update active button
    const buttons = document.querySelectorAll('.unit-btn');
    buttons.forEach((btn, index) => {
        if (btn.innerText.includes(`Unit ${unitNum}:`)) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });

    // Reset search
    document.getElementById('searchInput').value = '';

    // Render corresponding view
    if (currentTab === 1) {
        renderVocabulary();
    } else {
        startQuiz();
    }
}

// Switch Tab Handler
function switchTab(tabNum) {
    currentTab = tabNum;
    const tab1Btn = document.getElementById('tab1Btn');
    const tab2Btn = document.getElementById('tab2Btn');
    const vocabTab = document.getElementById('vocabTab');
    const quizTab = document.getElementById('quizTab');

    if (tabNum === 1) {
        tab1Btn.classList.add('active');
        tab2Btn.classList.remove('active');
        vocabTab.style.display = 'block';
        quizTab.style.display = 'none';
        renderVocabulary();
    } else {
        tab2Btn.classList.add('active');
        tab1Btn.classList.remove('active');
        vocabTab.style.display = 'none';
        quizTab.style.display = 'block';
        startQuiz();
    }
}

    const unitData = vocabularyData[currentUnit];

    if (!unitData || !unitData.words || unitData.words.length === 0) {
        grid.innerHTML = `<div class="empty-msg">Chưa có dữ liệu từ vựng cho Unit này.</div>`;
        countDisplay.innerText = "Tổng số: 0 từ vựng";
        return;
    }

    currentVocabList = unitData.words;
    displayCards(currentVocabList);
}

function displayCards(wordsList) {
    const grid = document.getElementById('vocabGrid');
    const countDisplay = document.getElementById('vocabCount');
    countDisplay.innerText = `${vocabularyData[currentUnit].title} — Tổng số: ${wordsList.length} từ vựng`;

    if (wordsList.length === 0) {
        grid.innerHTML = `<div class="empty-msg">Không tìm thấy từ vựng phù hợp.</div>`;
        return;
    }

    grid.innerHTML = wordsList.map(item => {
        const typeClass = item.type.replace('.', '');
        return `
            <div class="vocab-card">
                <div class="type-badge ${typeClass}">${item.type}</div>
                <div class="card-content">
                    <div class="word-title">${item.word}</div>
                    <div class="phonetic">${item.phonetic}</div>
                    <div class="meaning">${item.meaning}</div>
                    <div class="example-box">💬 <strong>Ví dụ:</strong> ${item.example}</div>
                </div>
                <div class="card-footer">
                    <button class="audio-btn" title="Phát âm từ này" onclick="speakWord('${item.word.replace(/'/g, "\'")}')">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.74 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                    </button>
                    <span style="font-size:12px; color:#adb5bd; font-weight:600;">Ms Lê Hằng English</span>
                </div>
            </div>
        `;
    }).join('');
}

// Filter Vocabulary with Search
function filterVocab() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!vocabularyData[currentUnit]) return;
    const filtered = vocabularyData[currentUnit].words.filter(item => 
        item.word.toLowerCase().includes(query) || 
        item.meaning.toLowerCase().includes(query)
    );
    displayCards(filtered);
}

// 6. QUIZ GENERATOR (30 QUESTIONS GENERATED dynamically)
function startQuiz() {
    const unitData = vocabularyData[currentUnit];
    document.getElementById('quizUnitTitle').innerText = `Đề Thi Trắc Nghiệm - ${unitData.title}`;
    
    // Generate 30 Quiz Questions from current unit (or pooled if words < 30)
    quizQuestions = generateQuestions(unitData.words, 30);
    currentQuestionIndex = 0;
    userScore = 0;
    
    showQuestion(currentQuestionIndex);
}

function generateQuestions(wordList, targetCount = 30) {
    const questions = [];
    const pool = [...wordList];

    // If pool is smaller than 30, duplicate or pool with other units
    let extendedPool = [...pool];
    if (extendedPool.length < targetCount) {
        Object.keys(vocabularyData).forEach(u => {
            if (parseInt(u) !== currentUnit) {
                extendedPool = extendedPool.concat(vocabularyData[u].words);
            }
        });
    }

    // Shuffle extended pool
    extendedPool.sort(() => Math.random() - 0.5);

    for (let i = 0; i < targetCount; i++) {
        const targetWord = extendedPool[i % extendedPool.length];
        
        // Generate question types: 1 = En to Vi, 2 = Vi to En, 3 = Fill in the blank
        const qType = (i % 3) + 1;
        
        // Pick 3 wrong distractor options
        const distractors = extendedPool
            .filter(w => w.word !== targetWord.word)
            .sort(() => Math.random() - 0.5)
            .slice(0, 3);

        if (qType === 1) {
            // English -> Vietnamese
            const options = [targetWord.meaning, ...distractors.map(d => d.meaning)].sort(() => Math.random() - 0.5);
            questions.push({
                question: `Từ "<strong>${targetWord.word}</strong>" (${targetWord.phonetic}) trong tiếng Việt có nghĩa là gì?`,
                options: options,
                answer: targetWord.meaning
            });
        } else if (qType === 2) {
            // Vietnamese -> English
            const options = [targetWord.word, ...distractors.map(d => d.word)].sort(() => Math.random() - 0.5);
            questions.push({
                question: `Nghĩa "<strong>${targetWord.meaning}</strong>" tương ứng với từ tiếng Anh nào dưới đây?`,
                options: options,
                answer: targetWord.word
            });
        } else {
            // Fill in example blank
            const maskedExample = targetWord.example.replace(new RegExp(targetWord.word, 'gi'), '_______');
            const options = [targetWord.word, ...distractors.map(d => d.word)].sort(() => Math.random() - 0.5);
            questions.push({
                question: `Điền từ thích hợp vào chỗ trống:<br><em>"${maskedExample}"</em>`,
                options: options,
                answer: targetWord.word
            });
        }
    }
    return questions;
}

function showQuestion(index) {
    const container = document.getElementById('quizContent');
    const progressBar = document.getElementById('quizProgressBar');
    const questionCount = document.getElementById('quizQuestionCount');

    if (index >= quizQuestions.length) {
        // Show Final Score
        progressBar.style.width = '100%';
        questionCount.innerText = `Hoàn thành ${quizQuestions.length} / ${quizQuestions.length}`;
        container.innerHTML = `
            <div class="score-board">
                <h3>🎉 CHÚC MỪNG BẠN ĐÃ HOÀN THÀNH BÀI THI! 🎉</h3>
                <p style="font-size: 20px; font-weight: 800; color: #212529; margin: 15px 0;">
                    Điểm số của bạn: <span style="color: var(--accent-coral);">${userScore} / ${quizQuestions.length}</span>
                </p>
                <p style="color: #6c757d; font-weight: 600;">
                    ${userScore >= 25 ? 'Cực kỳ xuất sắc! Bạn đã làm chủ lượng từ vựng này!' : 'Cố gắng lên nhé! Hãy ôn luyện lại thẻ từ vựng và làm lại bài test!'}
                </p>
                <button class="restart-btn" onclick="startQuiz()">🔄 Làm Bán Thi Lại</button>
            </div>
        `;
        return;
    }

    const q = quizQuestions[index];
    const progressPercent = ((index) / quizQuestions.length) * 100;
    progressBar.style.width = `${progressPercent}%`;
    questionCount.innerText = `Câu ${index + 1} / ${quizQuestions.length}`;

    container.innerHTML = `
        <div class="question-card">
            <div class="question-title">${index + 1}. ${q.question}</div>
            <div class="options-grid">
                ${q.options.map((opt, optIdx) => `
                    <button class="option-btn" onclick="checkAnswer(this, '${opt.replace(/'/g, "\'")}', '${q.answer.replace(/'/g, "\'")}')">
                        <strong>${String.fromCharCode(65 + optIdx)}.</strong> ${opt}
                    </button>
                `).join('')}
            </div>
        </div>
        <div class="quiz-controls">
            <span style="font-size: 14px; color: #868e96; font-weight: 700;">Điểm hiện tại: ${userScore}</span>
            <button class="next-btn" id="nextBtn" style="display:none;" onclick="nextQuestion()">Câu Tiếp Theo ➔</button>
        </div>
    `;
}

function checkAnswer(btn, selected, correct) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.disabled = true);

    if (selected === correct) {
        btn.classList.add('correct');
        userScore++;
    } else {
        btn.classList.add('wrong');
        buttons.forEach(b => {
            if (b.innerText.includes(correct)) {
                b.classList.add('correct');
            }
        });
    }

    document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
    currentQuestionIndex++;
    showQuestion(currentQuestionIndex);
}

// Initial Loading
window.onload = function() {
    renderVocabulary();
};
</script>
